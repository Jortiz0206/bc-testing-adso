# Base de datos de PRUEBA para los tests de integración y los E2E.
# Usa el mismo motor y versión mayor que la BD de desarrollo (backend/docker-compose.yml),
# pero en otro puerto (5433) y con una BD que termina en _test, para no tocar la de desarrollo.
# El esquema se crea igual que en desarrollo: con backend/init.sql al iniciar el contenedor.
#
#   docker compose up -d --wait     # levanta la BD de pruebas
#   docker compose down -v          # la apaga y borra los datos
services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: classkids
      POSTGRES_PASSWORD: classkids
      POSTGRES_DB: classkids_test
    ports:
      - "5433:5432"
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classkids -d classkids_test"]
      interval: 2s
      retries: 15
